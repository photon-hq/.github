name: Seed duplication vectors
run-name: Seed vectors on ${{ github.ref }}
on:
  push:
    branches: [main]
  workflow_call:

permissions: {}

jobs:
  seed:
    if: >-
      github.event_name == 'push' && !github.event.deleted &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.event.repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    concurrency:
      group: seed-duplication-vectors-${{ github.ref }}
    env:
      JSCPD_VERSION: '5.4.3'
      MODEL: CodeRankEmbed
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Check for tracked JS or TS
        id: scope
        working-directory: source
        env:
          POLICY_SHA: ${{ job.workflow_sha }}
        run: |
          : "${POLICY_SHA:?missing defining workflow SHA}"
          git ls-files -z -- '*.js' '*.es' '*.es6' '*.jsx' '*.mjs' '*.cjs' '*.ts' '*.tsx' '*.mts' '*.cts' > "$RUNNER_TEMP/js-files"
          if [ -s "$RUNNER_TEMP/js-files" ]; then echo 'js=true' >> "$GITHUB_OUTPUT"; fi

      - name: Check out the implementation at the workflow revision
        if: steps.scope.outputs.js == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: photon-hq/.github
          ref: ${{ job.workflow_sha }}
          path: policy
          sparse-checkout: .github/duplication
          persist-credentials: false

      - name: Prepare the scanner outside the source tree
        if: steps.scope.outputs.js == 'true'
        run: |
          tool="$RUNNER_TEMP/jscpd"
          mkdir -p "$tool"
          git -C source worktree add --quiet --detach "$tool/base" "$GITHUB_SHA"
          (cd "$tool" && npm install --ignore-scripts --no-audit --no-fund --no-save "jscpd@$JSCPD_VERSION")

      - name: Restore the previous verified default-branch snapshot
        if: steps.scope.outputs.js == 'true'
        continue-on-error: true
        timeout-minutes: 2
        working-directory: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I ../policy/.github/duplication/baseline.py restore

      - name: Restore public model weights
        if: steps.scope.outputs.js == 'true'
        id: weights
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/jscpd/models/nomic-ai--CodeRankEmbed
          key: jscpd-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.JSCPD_VERSION }}-${{ env.MODEL }}-weights

      - name: Verify the pinned model weights
        if: steps.scope.outputs.js == 'true'
        timeout-minutes: 5
        run: |
          rm -f -- "$HOME"/.cache/jscpd/models/nomic-ai--CodeRankEmbed/*/.verified
          cd "$RUNNER_TEMP/jscpd"
          node_modules/.bin/jscpd --semantic-download "$MODEL"

      - name: Save verified public model weights
        if: steps.scope.outputs.js == 'true' && steps.weights.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/jscpd/models/nomic-ai--CodeRankEmbed
          key: jscpd-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.JSCPD_VERSION }}-${{ env.MODEL }}-weights

      - name: Embed the default-branch revision
        if: steps.scope.outputs.js == 'true'
        timeout-minutes: 12
        run: |
          cd "$RUNNER_TEMP/jscpd/base"
          python3 -I "$GITHUB_WORKSPACE/policy/.github/duplication/scan.py" seed

      - name: Stage only the native vector binary
        if: steps.scope.outputs.js == 'true'
        id: snapshot
        run: python3 -I policy/.github/duplication/baseline.py stage

      - name: Publish the immutable snapshot
        if: steps.snapshot.outputs.file != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.snapshot.outputs.file }}
          archive: false
          if-no-files-found: error
          retention-days: 30
